# Dependency update PRs. Alerts and automated security fixes are enabled in the
# repository settings; this file adds the routine version bumps on top.
#
# Grouped by ecosystem rather than left per-package: ungrouped, a React or
# Vite bump alone opens a dozen PRs for packages that only ever move together,
# which is noise on a project maintained by one person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Majors excluded: React 20 or a Vite major is a migration, not a bump,
      # and should arrive as its own deliberate PR rather than inside a group.
      frontend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
